# Triển khai HRM bằng Docker Compose. Chuẩn bị file .env từ .env.production.example trước khi chạy.
#   docker compose up -d --build
#   docker compose run --rm migrate npx tsx scripts/create-admin.ts --email quantri@congty.vn
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hrm}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Không mở cổng DB ra ngoài; chỉ app trong mạng nội bộ compose truy cập được

  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrm}?schema=public
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrm}?schema=public
      STORAGE_DIR: /app/storage
      BACKUP_DIR: /app/backups
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - storage:/app/storage
    ports:
      # Chỉ lắng nghe localhost (để kiểm tra trên máy chủ); người dùng truy cập qua Caddy HTTPS
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Thiếu DOMAIN (tên miền, ví dụ hrm.congty.vn)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
